plugins {
	// Minecraft 1.20.1 is obfuscated: use the remapping Loom plugin with Mojang's official mappings.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Fabric, Mojang and Maven Central repositories automatically.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// Separate folders so a dev client and dev server can run side by side.
		server {
			runDir "run-server"
		}
	}

	mods {
		"grandline" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Creates the "gametest" source set plus the runGameTest (headless server) and
	// runClientGameTest (real client) tasks. Test code never ends up in the release jar.
	configureTests {
		createSourceSet = true
		modId = "grandline-test"
		enableGameTests = true
		enableClientGameTests = false // the client gametest API does not exist for 1.20.1
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

// Write a JUnit-style XML report of server game test results.
tasks.named("runGameTest") {
	def report = layout.buildDirectory.file("reports/gametest/server-gametests.xml")
	outputs.file(report)
	doFirst { report.get().asFile.parentFile.mkdirs() }
	jvmArgs "-Dfabric-api.gametest.report-file=${report.get().asFile.absolutePath}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
